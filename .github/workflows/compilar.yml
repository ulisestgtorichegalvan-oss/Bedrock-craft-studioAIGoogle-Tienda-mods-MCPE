name: Generar APK Bedrock Craft

on:
  push:
    branches: [ main ] # Se activa automáticamente al guardar este archivo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Configurar Java para Android
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar dependencias de Capacitor
      run: npm install

    - name: Crear plataforma Android
      run: |
        mkdir www
        cp index.html www/
        npx cap add android
        npx cap sync android

    - name: Compilar APK con Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Guardar APK como resultado
      uses: actions/upload-artifact@v4
      with:
        name: BedrockCraftTienda.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
